name: Run Pytest

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libcairo2-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers and OS Dependencies
        run: python -m playwright install --with-deps

      - name: Test with pytest
        working-directory: ./noethysweb
        run: |
          HEADLESS=1 pytest -v --cov=. --cov-report=term-missing --cov-report=html

     - name: Upload Coverage HTML Report
       uses: actions/upload-artifact@v7
       if: always()
       with:
         name: coverage-report
         path: htmlcov/
