name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Install Python dependencies
        run: uv sync

      - name: Install Playwright browser (Chromium + OS deps)
        run: uv run playwright install --with-deps chromium

      - name: Run migrations
        run: DJANGO_SETTINGS_MODULE=noethysweb.settings_test uv run noethysweb/manage.py migrate

      - name: Run test suite
        run: cd noethysweb && uv run pytest -x
        env:
          # Run Playwright headless in CI; set HEADLESS=0 locally for a headed browser
          HEADLESS: "1"
