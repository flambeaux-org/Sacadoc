name: Set up test environment
description: Install Python, system packages, Python dependencies and (optionally) Playwright browsers, then run migrations.

inputs:
  playwright:
    description: Install Playwright browsers and their OS dependencies
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install system dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y pkg-config libcairo2-dev

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install -r requirements_test.txt

    - name: Install Playwright Browsers and OS Dependencies
      if: inputs.playwright == 'true'
      shell: bash
      run: python -m playwright install --with-deps

    - name: Run migrations
      shell: bash
      working-directory: ./noethysweb
      run: python manage.py migrate
