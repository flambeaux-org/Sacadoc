name: Signaler un bug
description: Quelque chose ne fonctionne pas
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Ne collez aucune donnée personnelle (noms, adresses, mots de passe…).
  - type: input
    id: url
    attributes:
      label: URL de la page concernée
      placeholder: "https://sacadoc.flambeaux.org/utilisateur/..."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: captures
    attributes:
      label: Captures d'écran / erreurs
  - type: input
    id: version
    attributes:
      label: Version et navigateur
      placeholder: "ex. 1.3.5.6.90, Firefox 130"
