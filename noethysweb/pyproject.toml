  "pycryptodomex==3.17",
  "pyee==13.0.0",
  "pygments==2.19.2",
  "pypdf==5.1.0",
  "pystrich==0.9",
  "python-dateutil==2.8.2",
  "python-gnupg==0.4.7",
  "python-slugify==8.0.4",
  "pytz==2023.3",
  "reportlab==3.6.13",
  "requests==2.30.0",
  "requests-file==1.5.1",
  "requests-toolbelt==1.0.0",
  "rlpycairo==0.2.0",
  "sgmllib3k==1.0.0",
  "six==1.16.0",
  "soupsieve==2.4.1",
  "sqlparse==0.4.4",
  "stone==3.3.1",
  "stripe==14.3.0",
  "tomli==2.3.0",
  "typing-extensions==4.12.2",
  "urllib3==2.0.2",
  "webencodings==0.5.1",
  "xlrd==2.0.1",
  "xlsxwriter==3.1.9",
  "zeep==4.2.1",
