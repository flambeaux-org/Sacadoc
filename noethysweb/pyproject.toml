[project]
name = "noethysweb"
version = "0.1.0"
description = "Application de gestion multi-activités pour associations et centres de loisirs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "asgiref==3.6.0",
  "attrs==23.1.0",
  "beautifulsoup4==4.11.1",
  "bleach==4.1.0",
  "certifi==2023.5.7",
  "cffi==1.15.1",
  "charset-normalizer==3.1.0",
  "click==8.1.3",
  "colorhash==1.2.1",
  "cryptography==40.0.2",
  "django==3.2.19",
  "django-anymail==8.4",
  "django-appconf==1.0.5",
  "django-axes==5.26.0",
  "django-cleanup==7.0.0",
  "django-crispy-forms==1.13.0",
  "django-crontab==0.7.1",
  "django-cryptography==1.0",
  "django-csp==3.7",
  "django-datatable-view==2.1.6",
  "django-dbbackup==3.3.0",
  "django-debug-toolbar==3.2.2",
  "django-extensions==3.1.3",
  "django-formtools==2.3",
  "django-ipware==4.0.2",
  "django-multiselectfield==0.1.12",
  "django-ranged-response==0.2.0",
  "django-resized==1.0.3",
  "django-select2==7.11.1",
  "django-sn==0.8.11.9",
  "django-storages==1.13.1",
  "django-turnstile==0.1.3",
  "django-upload-form==0.5.0",
  "dnspython>=2.8.0",
  "docx-mailmerge2==0.8.0",
  "dropbox==12.0.2",
  "eopayment==1.79",
  "exceptiongroup==1.3.0",
  "feedparser==6.0.10",
  "freetype-py==2.3.0",
  "greenlet==3.2.4",
  "gunicorn==23.0.0",
  "idna==3.4",
  "iniconfig==2.3.0",
  "inotify==0.2.10",
  "isodate==0.6.1",
  "jellyfish==0.8.9",
  "lxml==4.9.0",
  "mysqlclient==2.0.3",
  "nose==1.3.7",
  "numpy==1.24.3",
  "opencv-python==4.7.0.72",
  "packaging==23.1",
