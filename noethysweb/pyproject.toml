[tool.mypy]
plugins = ["mypy_django_plugin.main"]
exclude = ["static/lib/table-export/tools/"]

[tool.django-stubs]
django_settings_module = "noethysweb.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "noethysweb.settings_test"
addopts = ["--nomigrations", "--reuse-db", "--tb=short"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]


[dependency-groups]
dev = [
  "basedpyright>=1.39.0",
  "coverage>=7.13.5",
  "django-stubs[compatible-mypy]>=6.0.4",
  "django-types>=0.23.0",
  "factory-boy>=3.3.3",
  "faker>=40.13.0",
  "inflection>=0.5.1",
  "mypy>=1.20.1",
  "pylsp-mypy>=0.7.1",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.12.0",
  "pytest-factoryboy>=2.8.1",
  "pytest-mock>=3.15.1",
  "playwright==1.56.0",
  "pytest-playwright>=0.7.1",
  "python-lsp-server[all]>=1.14.0",
]
